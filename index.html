<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDAT · TERMINAL</title>
<style>
 :root{
   --bg:#05070a; --panel:#0a0f0c; --line:#123018; --dim:#2f6b3f;
   --fg:#c8f7d4; --phos:#39ff88; --phos-dim:#1f7a44; --up:#39ff88; --down:#ff5c6c;
 }
 *{box-sizing:border-box}
 body{background:var(--bg);color:var(--fg);
   font:12px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;margin:0}
 .strip{display:flex;justify-content:space-between;align-items:center;
   gap:16px;padding:8px 14px;border-bottom:2px solid var(--line);
   background:linear-gradient(#0a140d,#05070a);position:sticky;top:0;z-index:5}
 .brand{color:var(--phos);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
 .brand b{color:var(--fg)}
 .strip .meta{color:var(--phos-dim);text-transform:uppercase;letter-spacing:.08em}
 .live{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;
   letter-spacing:.1em}
 .dot{width:8px;height:8px;border-radius:50%;background:var(--phos);
   box-shadow:0 0 8px var(--phos)}
 .dot.stale{background:#e0af68;box-shadow:0 0 8px #e0af68}
 .eq{color:var(--phos);font-weight:700;font-size:14px}
 main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
   border-bottom:1px solid var(--line)}
 .col{display:flex;flex-direction:column;gap:1px;background:var(--line)}
 .panel{background:var(--panel);padding:11px 13px}
 .panel.full{grid-column:1/3}
 h3{margin:0 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
   color:var(--phos);border-bottom:1px solid var(--line);padding-bottom:5px}
 .muted{color:var(--dim)}
 .unavail{color:#e0af68}
 .row{margin-bottom:3px;white-space:pre-wrap}
 .up{color:var(--up)} .down{color:var(--down)}
 /* positions grid rows */
 .prow{display:grid;grid-template-columns:1.2fr .6fr .8fr .8fr .7fr;
   font-variant-numeric:tabular-nums}
 .prow.head{color:var(--phos-dim);text-transform:uppercase;letter-spacing:.06em}
 svg{display:block}
</style></head>
<body>
 <div class="strip">
   <div class="brand"><b>TDAT</b> · TERMINAL</div>
   <div class="live"><span class="meta" id="mode"></span>
     <span class="meta" id="updated"></span>
     <span class="live" title="Alpaca book (GitHub Actions, ~30 min)"
       ><span class="dot" id="dot"></span><span id="livetxt">ALPACA</span></span>
     <span class="live" title="Polymarket book (operator Mac, hourly when awake)"
       ><span class="dot" id="pdot"></span><span id="plivetxt">POLY</span></span>
     <span class="badge"><span class="dot" id="mdot"></span><span id="mlivetxt">MAKER</span></span>
     <span class="eq" id="equity"></span></div>
 </div>
 <main>
   <div class="col">
     <div class="panel"><h3>Short-Window</h3><div id="sw"></div></div>
   </div>
   <div class="col">
     <div class="panel"><h3>Alerts</h3><div id="alerts"></div></div>
     <div class="panel"><h3>Gov · Decisions</h3><div id="decisions"></div></div>
     <div class="panel"><h3>Analyst</h3><div id="analyst"></div></div>
   </div>
   <div class="col">
     <div class="panel"><h3>Gov · Orders <span class="meta">(broker truth)</span></h3>
       <div id="orders"></div></div>
   </div>
   <div class="col">
     <div class="panel"><h3>Maker · Book <span class="meta">(spread capture)</span></h3>
       <div id="mk"></div></div>
     <div class="panel"><h3>Polymarket · Funnel</h3><div id="pfunnel"></div></div>
   </div>
   <div class="col">
     <div class="panel"><h3>Polymarket · Positions</h3><div id="ppos"></div></div>
   </div>
   <div class="panel full"><h3>Equity</h3><div id="equity_curve"></div></div>
   <div class="panel full"><h3>Open Positions</h3><div id="positions"></div></div>
 </main>

 <script>
 const POLL_MS = 45000;
 const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const el = id => document.getElementById(id);
 let lastGood = null, lastFetch = Date.now(), polyGood = null;

 function svgCurve(points){
   if(!points || points.length < 2) return '<div class="muted">equity curve unavailable</div>';
   const eqs = points.map(p=>p.equity), lo=Math.min(...eqs), hi=Math.max(...eqs);
   const span=(hi-lo)||1, n=points.length;
   const pts = points.map((p,i)=>`${(i*(600/(n-1))).toFixed(1)},${(100-(p.equity-lo)/span*90).toFixed(1)}`).join(' ');
   return `<svg viewBox="0 0 600 110" width="100%" height="90" preserveAspectRatio="none">`+
     `<polyline fill="none" stroke="var(--phos)" stroke-width="2" points="${pts}"/></svg>`;
 }

 function renderSW(s){
   const t = el('sw'), ts = s.sw_trades || [];
   if(!ts.length){ t.innerHTML='<div class="muted">no short-window trades today</div>'; return; }
   t.innerHTML = ts.map(x=>{
     if(x.status==='open')
       return `<div class="row">OPEN <b>${esc(x.symbol)}</b> ${x.qty} @ ${x.entry_price.toFixed(2)} (tp ${x.tp_price.toFixed(2)} / stop ${x.stop_price.toFixed(2)})</div>`;
     const pnl=x.pnl_usd||0, cls=pnl>=0?'up':'down';
     return `<div class="row">CLOSED <b>${esc(x.symbol)}</b> P&L <span class="${cls}">$${pnl.toFixed(2)}</span> (${esc(x.exit_reason||'')})</div>`;
   }).join('');
 }

 function renderAlerts(s){
   const c={ok:'var(--up)',warn:'#e0af68',crit:'var(--down)'};
   el('alerts').innerHTML = (s.alerts||[]).map(a=>
     `<div class="row" style="color:${c[a.level]||'var(--fg)'}">● ${esc(a.message)}</div>`).join('')
     || '<div class="muted">—</div>';
 }

 function renderDecisions(s){
   const lines=(s.decisions&&s.decisions.lines)||[];
   el('decisions').innerHTML = lines.map(l=>`<div class="row">${esc(l)}</div>`).join('')
     || '<div class="muted">no decisions today</div>';
 }

 function renderAnalyst(s){
   const a=s.analyst||[];
   el('analyst').innerHTML = a.map(x=>
     `<div class="row"><b>${esc(x.ticker)}</b> <span class="${x.action==='BUY'?'up':''}">${esc(x.action)}</span> — ${esc((x.reasoning||'').slice(0,160))}</div>`).join('')
     || '<div class="muted">no analyst activity</div>';
 }

 function renderPositions(s){
   const t=el('positions');
   if(s.positions_unavailable){ t.innerHTML='<div class="unavail">UNAVAILABLE</div>'; return; }
   const ps=s.positions||[];
   if(!ps.length){ t.innerHTML='<div class="muted">no open positions</div>'; return; }
   const head='<div class="prow head"><span>Ticker</span><span>Qty</span><span>Entry</span><span>Current</span><span>P/L%</span></div>';
   t.innerHTML = head + ps.map(p=>{
     const cls=p.unrealized_pct>=0?'up':'down';
     return `<div class="prow"><span><b>${esc(p.ticker)}</b></span><span>${p.qty}</span>`+
       `<span>${p.entry.toFixed(2)}</span><span>${p.current.toFixed(2)}</span>`+
       `<span class="${cls}">${p.unrealized_pct>=0?'+':''}${p.unrealized_pct.toFixed(2)}%</span></div>`;
   }).join('');
 }

 // The panel that was missing. `decisions` said "traded" and `orders` said
 // "submitted" for a month of XAR buys that every one of them expired
 // unfilled — on this page that was indistinguishable from a working book.
 // Show the BROKER's verdict, and colour it, so it can never blend in again.
 function renderOrders(s){
   const os = s.orders || [];
   if(!os.length){ el('orders').innerHTML='<div class="muted">no orders yet</div>'; return; }
   const cls = st => st==='filled' ? 'up'
     : (st==='expired'||st==='rejected'||st==='canceled') ? 'down' : 'muted';
   el('orders').innerHTML = os.map(o=>
     `<div class="row">${esc((o.created_at||'').slice(5,16))} `+
     `<b>${esc(o.ticker)}</b> ${o.qty} @ ${Number(o.limit_price).toFixed(2)} `+
     `<span class="${cls(o.status)}">${esc(o.status)}</span></div>`).join('');
 }

 let makerGood = null;
 function renderMaker(m){
   const cap = m.exposure_cap_usd||0, exp = m.exposure_usd||0;
   const atCap = cap && exp >= cap;
   const mk = m.markout_avg;
   el('mk').innerHTML =
     `<div class="row"><b>${esc(m.live?'LIVE · real quotes':'shadow')}</b>`+
     ` · cash $${(m.bankroll_usd||0).toFixed(2)}</div>`+
     `<div class="row">exposure <span class="${atCap?'down':''}">`+
     `$${exp.toFixed(2)} / $${cap.toFixed(2)}</span>`+
     `${atCap?' <span class="down">AT CAP — not quoting</span>':''}</div>`+
     `<div class="row">fills ${m.fills_total||0} · realized `+
     `<span class="${(m.realized_pnl_usd||0)>=0?'up':'down'}">`+
     `$${(m.realized_pnl_usd||0).toFixed(4)}</span></div>`+
     // Markout is the whole verdict: positive means we earn the spread,
     // negative means informed flow is picking us off.
     (mk==null ? `<div class="row muted">markout — no scored fills yet</div>`
       : `<div class="row">avg markout <span class="${mk>=0?'up':'down'}">`+
         `${mk>=0?'+':''}${mk.toFixed(5)}</span> `+
         `<span class="muted">(${mk>=0?'earning the spread':'being picked off'})</span></div>`)+
     (m.positions||[]).slice(0,4).map(q=>
       `<div class="row muted">   ${esc(String(q.token_id).slice(0,10))} `+
       `${Number(q.shares).toFixed(0)} @ ${Number(q.avg_cost).toFixed(3)} `+
       `= $${Number(q.value_usd).toFixed(2)}</div>`).join('')+
     (m.recent_fills||[]).slice(0,4).map(f=>
       `<div class="row">${esc(f.side||'')} ${f.shares} @ ${Number(f.price).toFixed(3)} `+
       `<span class="muted">${esc(String(f.at||'').slice(11,16))}</span></div>`).join('');
 }

 function renderPoly(p){
   const f = p.funnel || {};
   const skips = Object.entries(f.skips||{}).sort((a,b)=>b[1]-a[1]);
   // scanned > 0 with priced == 0 is the signature of a silent break, not a
   // quiet day — the whole reason this funnel is on the page.
   const broken = (f.scanned>0 && !f.priced);
   el('pfunnel').innerHTML =
     `<div class="row">${broken?'<span class="down">BROKEN · scanned but priced nothing</span>'
       :'<b>'+esc(p.live_armed?'ARMED · real orders':'SHADOW · no real orders')+'</b>'}</div>`+
     `<div class="row">scanned ${f.scanned||0} → parsed ${f.parsed||0} → priced ${f.priced||0}</div>`+
     skips.map(([k,v])=>`<div class="row muted">   ${v} ${esc(k)}</div>`).join('')+
     `<div class="row muted">${p.predictions||0} predictions · ${p.resolved||0} resolved`
     + (p.indep_bets != null
        ? ` · <b>${p.indep_bets} indep bets</b>` : ``)
     + `</div>`;

   const rows = [];
   (p.live_open||[]).forEach(t=>rows.push(
     `<div class="row"><span class="up">LIVE</span> <b>${esc(t.underlying||'')}</b> `+
     `${esc(t.side||'')} ${t.shares} @ ${Number(t.entry_price).toFixed(3)}</div>`));
   (p.shadow_open||[]).forEach(t=>rows.push(
     `<div class="row muted">shadow <b>${esc(t.underlying||'')}</b> `+
     `${esc(t.side||'')} ${t.shares} @ ${Number(t.entry_price).toFixed(3)} `+
     `(fair ${Number(t.fair_p).toFixed(2)})</div>`));
   el('ppos').innerHTML = rows.join('') ||
     '<div class="muted">no open positions</div>';
   el('ppos').innerHTML += `<div class="row">live realized `+
     `<span class="${(p.live_realized_usd||0)>=0?'up':'down'}">`+
     `$${Number(p.live_realized_usd||0).toFixed(2)}</span>`+
     ` · exposure $${Number(p.live_exposure_usd||0).toFixed(2)}</div>`;
 }

 function render(s){
   lastGood = s;
   el('mode').textContent = s.broker_mode || '';
   el('updated').textContent = '· ' + (s.generated_at || '');
   el('equity').textContent = s.equity==null? '—' : '$'+Number(s.equity).toLocaleString(undefined,{maximumFractionDigits:0});
   el('equity_curve').innerHTML = svgCurve(s.equity_curve);
   renderSW(s);
   renderAlerts(s); renderDecisions(s); renderAnalyst(s); renderPositions(s);
   renderOrders(s);
 }

 // Age of the DATA, not of the last fetch. Measuring the fetch was the bug:
 // once a tick stopped, status.json stopped changing but every fetch still
 // succeeded, so the light stayed green over hours-old numbers.
 function ago(ms){
   const s=Math.max(0,Math.round(ms/1000));
   if(s<90) return s+'s ago';
   const m=Math.round(s/60); if(m<90) return m+'m ago';
   const h=m/60; if(h<48) return h.toFixed(1)+'h ago';
   return Math.round(h/24)+'d ago';
 }
 // Each book has its own clock: the Alpaca book ticks in GitHub Actions every
 // ~30 min, the Polymarket book on the operator's Mac hourly and only while it
 // is awake. One shared light would lie about whichever half had stopped.
 function badge(dotId, txtId, label, ts, limitMs){
   const d=el(dotId), t=el(txtId);
   if(!ts){ d.classList.add('stale'); t.textContent=label+' —'; return; }
   const age = Date.now() - ts*1000, stale = age > limitMs;
   d.classList.toggle('stale', stale);
   t.textContent = label+' '+ago(age);
 }

 function tickStaleness(){
   badge('dot','livetxt','ALPACA', lastGood && lastGood.generated_ts, 2*60*60*1000);
   badge('pdot','plivetxt','POLY', polyGood && polyGood.generated_ts, 3*60*60*1000);
   // The maker runs every 5 min, so it goes stale far sooner than the others.
   badge('mdot','mlivetxt','MAKER', makerGood && makerGood.generated_ts, 20*60*1000);
 }

 async function poll(){
   try{
     const r = await fetch('./status.json', {cache:'no-store'});
     if(r.ok){ render(await r.json()); lastFetch = Date.now(); }
     else if(lastGood){ render(lastGood); }
   }catch(e){ /* keep lastGood; the age badge handles it */ }
   try{
     // Absent on a fresh dash repo, and absent is not an error: it means the
     // Mac has not published a cycle yet. The badge shows that as stale.
     const r = await fetch('./poly_status.json', {cache:'no-store'});
     if(r.ok){ polyGood = await r.json(); renderPoly(polyGood); }
   }catch(e){ /* keep polyGood */ }
   try{
     const r = await fetch('./maker_status.json', {cache:'no-store'});
     if(r.ok){ makerGood = await r.json(); renderMaker(makerGood); }
   }catch(e){ /* keep makerGood */ }
 }

 render(JSON.parse(el('snapshot').textContent));
 poll();
 setInterval(poll, POLL_MS);
 setInterval(tickStaleness, 1000);
 tickStaleness();
 </script>
